<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>试为苏东坡 — 乌台诗案</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;600;700;900&family=ZCOOL+XiaoWei&display=swap');

  :root {
    --ink: #2A1F1A;
    --ink-light: #5C4A3A;
    --ink-faint: #8B7355;
    --paper: #F4EDE0;
    --paper-warm: #EDE4D3;
    --paper-deep: #E2D5BF;
    --accent-vermilion: #C84B31;
    --accent-gold: #B8963E;
    --accent-jade: #5B8C6F;
    --accent-indigo: #3D5A80;
    --shadow: rgba(42, 31, 26, 0.12);
    --glow: rgba(184, 150, 62, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif SC', serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* === TEXTURE OVERLAY === */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
  }

  /* === SCREENS === */
  .screen {
    display: none;
    min-height: 100vh;
    position: relative;
  }
  .screen.active { display: flex; flex-direction: column; }

  /* === TITLE SCREEN === */
  #title-screen {
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    background: 
      radial-gradient(ellipse at 30% 20%, rgba(184, 150, 62, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(91, 140, 111, 0.06) 0%, transparent 50%),
      var(--paper);
  }

  .title-container {
    max-width: 560px;
    animation: titleFadeIn 1.5s ease-out;
  }

  @keyframes titleFadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .title-era {
    font-size: 0.85rem;
    letter-spacing: 0.5em;
    color: var(--ink-faint);
    margin-bottom: 2rem;
    font-weight: 400;
  }

  .title-main {
    font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
    font-size: clamp(2.8rem, 8vw, 4.2rem);
    font-weight: 400;
    letter-spacing: 0.15em;
    line-height: 1.3;
    margin-bottom: 1.5rem;
    color: var(--ink);
  }

  .title-sub {
    font-size: 1rem;
    color: var(--ink-light);
    font-weight: 400;
    line-height: 1.8;
    margin-bottom: 1rem;
  }

  .title-quote {
    font-size: 0.95rem;
    color: var(--accent-vermilion);
    font-style: italic;
    margin: 2.5rem 0;
    letter-spacing: 0.08em;
    opacity: 0;
    animation: quoteFade 1s ease-out 0.8s forwards;
  }

  @keyframes quoteFade {
    to { opacity: 1; }
  }

  .title-divider {
    width: 60px;
    height: 1px;
    background: var(--accent-gold);
    margin: 0 auto 2.5rem;
    opacity: 0;
    animation: dividerGrow 0.8s ease-out 0.5s forwards;
  }

  @keyframes dividerGrow {
    to { opacity: 1; width: 60px; }
  }

  .title-chapter-hint {
    font-size: 0.8rem;
    color: var(--ink-faint);
    letter-spacing: 0.3em;
    margin-bottom: 2rem;
  }

  /* === BUTTONS === */
  .btn-start {
    display: inline-block;
    padding: 1rem 3.5rem;
    background: transparent;
    border: 1px solid var(--ink-light);
    color: var(--ink);
    font-family: 'Noto Serif SC', serif;
    font-size: 1rem;
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: all 0.4s ease;
    opacity: 0;
    animation: btnAppear 0.6s ease-out 1.2s forwards;
  }

  @keyframes btnAppear {
    to { opacity: 1; }
  }

  .btn-start:hover {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* === NARRATIVE SCREEN === */
  #narrative-screen {
    background: var(--paper);
  }

  .narrative-header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 1.2rem 2rem;
    background: rgba(244, 237, 224, 0.92);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(42, 31, 26, 0.06);
  }

  .header-chapter {
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    color: var(--ink-faint);
  }

  .header-year {
    font-size: 0.75rem;
    color: var(--accent-gold);
    letter-spacing: 0.15em;
  }

  .narrative-body {
    max-width: 640px;
    margin: 0 auto;
    padding: 3rem 2rem 6rem;
    flex: 1;
  }

  /* === TEXT CONTENT === */
  .story-text {
    margin-bottom: 2rem;
    opacity: 0;
    transform: translateY(20px);
    animation: textReveal 0.8s ease-out forwards;
  }

  .story-text p {
    font-size: 1.05rem;
    line-height: 2;
    color: var(--ink);
    margin-bottom: 1.5rem;
    text-align: justify;
  }

  .story-text p:last-child { margin-bottom: 0; }

  @keyframes textReveal {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Scene description / atmosphere text */
  .scene-desc {
    font-size: 0.9rem;
    color: var(--ink-faint);
    font-style: italic;
    border-left: 2px solid var(--accent-gold);
    padding-left: 1.2rem;
    margin-bottom: 2rem;
    line-height: 1.9;
    opacity: 0;
    animation: textReveal 0.8s ease-out 0.3s forwards;
  }

  /* Dialogue */
  .dialogue {
    margin: 2rem 0;
    padding: 1.5rem 1.8rem;
    background: rgba(226, 213, 191, 0.4);
    border-radius: 4px;
    position: relative;
    opacity: 0;
    animation: textReveal 0.6s ease-out 0.2s forwards;
  }

  .dialogue-speaker {
    font-size: 0.8rem;
    color: var(--accent-vermilion);
    letter-spacing: 0.15em;
    margin-bottom: 0.6rem;
    font-weight: 600;
  }

  .dialogue-text {
    font-size: 1rem;
    line-height: 1.9;
    color: var(--ink);
  }

  /* === CHOICES === */
  .choices-container {
    margin-top: 3rem;
    opacity: 0;
    animation: choicesAppear 0.8s ease-out 0.6s forwards;
  }

  @keyframes choicesAppear {
    to { opacity: 1; }
  }

  .choices-prompt {
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    color: var(--ink-faint);
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .choice-btn {
    display: block;
    width: 100%;
    padding: 1.3rem 1.8rem;
    margin-bottom: 1rem;
    background: rgba(244, 237, 224, 0.6);
    border: 1px solid rgba(42, 31, 26, 0.12);
    border-radius: 4px;
    font-family: 'Noto Serif SC', serif;
    font-size: 0.95rem;
    line-height: 1.7;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .choice-btn::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    width: 3px;
    height: 100%;
    background: var(--accent-gold);
    transform: scaleY(0);
    transition: transform 0.3s ease;
  }

  .choice-btn:hover {
    background: rgba(226, 213, 191, 0.5);
    border-color: var(--accent-gold);
    padding-left: 2.2rem;
  }

  .choice-btn:hover::before {
    transform: scaleY(1);
  }

  .choice-btn:active {
    transform: scale(0.98);
  }

  .choice-label {
    font-size: 0.75rem;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    display: block;
    margin-bottom: 0.3rem;
  }

  /* === CONTINUE BUTTON === */
  .btn-continue {
    display: block;
    margin: 3rem auto 0;
    padding: 0.9rem 3rem;
    background: transparent;
    border: 1px solid rgba(42, 31, 26, 0.2);
    color: var(--ink-light);
    font-family: 'Noto Serif SC', serif;
    font-size: 0.9rem;
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: all 0.3s ease;
    opacity: 0;
    animation: btnAppear 0.6s ease-out 0.8s forwards;
  }

  .btn-continue:hover {
    border-color: var(--ink-light);
    color: var(--ink);
  }

  /* === TRANSITION === */
  .scene-transition {
    text-align: center;
    padding: 4rem 2rem;
    opacity: 0;
    animation: transitionIn 1.2s ease-out forwards;
  }

  @keyframes transitionIn {
    0% { opacity: 0; }
    50% { opacity: 1; }
    100% { opacity: 1; }
  }

  .transition-year {
    font-size: 2rem;
    font-weight: 200;
    color: var(--accent-gold);
    letter-spacing: 0.2em;
    margin-bottom: 0.5rem;
  }

  .transition-desc {
    font-size: 0.85rem;
    color: var(--ink-faint);
    letter-spacing: 0.15em;
  }

  /* === ENDING SCREEN === */
  #ending-screen {
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    min-height: 100vh;
    background: 
      radial-gradient(ellipse at 50% 40%, var(--glow) 0%, transparent 60%),
      var(--paper);
  }

  .ending-container {
    max-width: 520px;
    opacity: 0;
    animation: titleFadeIn 1.5s ease-out 0.3s forwards;
  }

  .ending-poem {
    font-size: 1.15rem;
    line-height: 2.2;
    color: var(--ink);
    margin-bottom: 3rem;
    font-style: italic;
  }

  .ending-reflection {
    padding: 2rem;
    background: rgba(226, 213, 191, 0.3);
    border-radius: 6px;
    margin-bottom: 2.5rem;
  }

  .ending-reflection-title {
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    color: var(--accent-gold);
    margin-bottom: 1rem;
  }

  .ending-reflection-text {
    font-size: 0.95rem;
    line-height: 2;
    color: var(--ink-light);
  }

  .ending-stats {
    display: flex;
    justify-content: center;
    gap: 2.5rem;
    margin-bottom: 3rem;
  }

  .stat-item {
    text-align: center;
  }

  .stat-num {
    font-size: 1.8rem;
    font-weight: 200;
    color: var(--accent-gold);
  }

  .stat-label {
    font-size: 0.75rem;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    margin-top: 0.3rem;
  }

  .btn-restart {
    display: inline-block;
    padding: 0.9rem 2.5rem;
    background: transparent;
    border: 1px solid var(--ink-light);
    color: var(--ink);
    font-family: 'Noto Serif SC', serif;
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.3s ease;
    margin: 0 0.5rem;
  }

  .btn-restart:hover {
    background: var(--ink);
    color: var(--paper);
  }

  /* === PROGRESS BAR === */
  .progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent-gold), var(--accent-vermilion));
    z-index: 999;
    transition: width 0.6s ease;
  }

  /* === PERSONALITY TRACKER (hidden) === */
  .personality-flash {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 0.7rem 1.5rem;
    background: rgba(42, 31, 26, 0.85);
    color: var(--paper);
    font-size: 0.8rem;
    border-radius: 4px;
    opacity: 0;
    transition: all 0.5s ease;
    z-index: 200;
    letter-spacing: 0.05em;
    pointer-events: none;
  }

  .personality-flash.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* === MOBILE === */
  @media (max-width: 600px) {
    .narrative-body { padding: 2rem 1.5rem 5rem; }
    .title-main { font-size: 2.4rem; }
    .story-text p { font-size: 1rem; }
    .ending-stats { gap: 1.5rem; }
  }

  /* Fade out animation for screen transitions */
  .fade-out {
    animation: fadeOut 0.5s ease-out forwards;
  }

  @keyframes fadeOut {
    to { opacity: 0; transform: translateY(-10px); }
  }

  .ink-wash-divider {
    width: 100%;
    height: 40px;
    margin: 2rem 0;
    background: radial-gradient(ellipse at center, rgba(42,31,26,0.06) 0%, transparent 70%);
    position: relative;
  }

  .ink-wash-divider::after {
    content: '◆';
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 0.5rem;
    color: var(--accent-gold);
  }
</style>
</head>
<body>

<div class="progress-bar" id="progressBar"></div>
<div class="personality-flash" id="personalityFlash"></div>

<!-- TITLE SCREEN -->
<div class="screen active" id="title-screen">
  <div class="title-container">
    <div class="title-era">北 宋 · 元 丰 二 年</div>
    <div class="title-divider"></div>
    <h1 class="title-main">试 为 苏 东 坡</h1>
    <p class="title-sub">从乌台诗案到黄州寒食</p>
    <p class="title-quote">「问汝平生功业，黄州惠州儋州。」</p>
    <div class="title-chapter-hint">第一章 · 风 暴 将 至</div>
    <button class="btn-start" onclick="startGame()">开 始 体 验</button>
  </div>
</div>

<!-- NARRATIVE SCREEN -->
<div class="screen" id="narrative-screen">
  <div class="narrative-header">
    <span class="header-chapter" id="chapterLabel">第一章</span>
    <span class="header-year" id="yearLabel">元丰二年</span>
  </div>
  <div class="narrative-body" id="narrativeBody">
    <!-- Dynamic content -->
  </div>
</div>

<!-- ENDING SCREEN -->
<div class="screen" id="ending-screen">
  <div class="ending-container" id="endingContent">
    <!-- Dynamic ending -->
  </div>
</div>

<script>
// ========== GAME ENGINE ==========
const state = {
  currentNode: null,
  choices: [],
  traits: {
    courage: 0,    // 勇气 vs 隐忍
    idealism: 0,   // 理想 vs 务实
    connection: 0, // 入世 vs 出世
    resilience: 0  // 坚韧 vs 脆弱
  },
  nodeCount: 0,
  totalNodes: 12
};

// ========== STORY DATA ==========
const story = {

// === ACT 1: THE STORM ===
"start": {
  chapter: "第一章 · 风暴将至",
  year: "元丰二年 · 七月",
  content: `
    <div class="scene-desc">湖州。夏末。蝉鸣如沸。</div>
    <div class="story-text">
      <p>你刚到湖州任知州不过三个月。江南的夏天潮湿闷热，你坐在官署里批完公文，顺手写了几首诗寄给朋友。</p>
      <p>诗里有几句牢骚——朝廷推行的新法让百姓怨声载道，你看不惯，就写了出来。这不是第一次了，你向来嘴上不饶人。</p>
      <p>你不知道的是，这些诗正在被人一首一首地摘录、注解、装订成册，送往御史台。</p>
    </div>
    <div class="dialogue">
      <div class="dialogue-speaker">幕僚</div>
      <div class="dialogue-text">大人，京中来了人。说是奉御史台之命……</div>
    </div>
    <div class="story-text">
      <p>你放下茶盏。御史台派人来湖州，这不寻常。你看见来人身后跟着的皇甫遵，面无表情。</p>
      <p>你心里明白了大半。</p>
    </div>
  `,
  choices: [
    { text: "整理衣冠，从容出迎。该来的躲不掉。", next: "arrest_calm", trait: "courage", value: 2 },
    { text: "先稳住，找借口拖延，连夜给京中的朋友写信求援。", next: "arrest_delay", trait: "idealism", value: -1 }
  ]
},

"arrest_calm": {
  chapter: "第一章 · 风暴将至",
  year: "元丰二年 · 七月",
  content: `
    <div class="story-text">
      <p>你换上官服，走出厅堂。皇甫遵看见你，微微一愣——大概没料到你这么平静。</p>
      <p>「苏轼接旨。」</p>
      <p>你跪下听完。御史台弹劾你以诗文讪谤朝政，即刻押赴京城受审。</p>
      <p>你站起来的时候腿有点软，但脸上没有露出来。身后传来衙役和家人的哭声，你回头看了一眼妻子王闰之，她抱着孩子站在廊下，眼眶红了但没有哭出声。</p>
    </div>
    <div class="story-text">
      <p>你转过身，跟着皇甫遵走了。</p>
      <p>一路上你想了很多。你想起王安石变法那年你第一次上书反对，想起弟弟子由劝你少说话，想起父亲当年教你读书时说的「文章是天下公器，不可以私意乱之」。</p>
    </div>
  `,
  continue: "prison_arrive"
},

"arrest_delay": {
  chapter: "第一章 · 风暴将至",
  year: "元丰二年 · 七月",
  content: `
    <div class="story-text">
      <p>你推说身体不适，让幕僚先去接待。自己匆匆铺开纸，给京城的王诜和驸马写信——他们在朝中还有些人脉。</p>
      <p>但信刚写了一半，皇甫遵已经带人闯了进来。</p>
      <p>「苏轼，御史台令你即刻进京，不得拖延。」</p>
      <p>你看着写到一半的信，墨迹未干。皇甫遵顺着你的目光也看到了，什么也没说，只是催促你尽快上路。</p>
    </div>
    <div class="story-text">
      <p>你心里发苦。不是怕死——当了这么多年官，你比谁都清楚，文字狱一旦开头，辩解是没有用的。你发苦的是连累了别人。那些跟你通信的朋友、收过你诗的人，一个都跑不掉。</p>
    </div>
  `,
  continue: "prison_arrive"
},

"prison_arrive": {
  chapter: "第一章 · 风暴将至",
  year: "元丰二年 · 八月",
  content: `
    <div class="scene-desc">御史台狱。又称「乌台」。高墙之内，柏树上栖满乌鸦。</div>
    <div class="story-text">
      <p>你被关进了乌台大狱。牢房潮湿阴暗，你是堂堂三品官员，此刻却和普通囚犯一样席地而坐。</p>
      <p>审讯很快开始了。御史们把你这些年写的诗翻了个遍，逐字逐句地追问：「这句'根到九泉无曲处，世间唯有蛰龙知'，是什么意思？你说的蛰龙是不是在影射陛下？」</p>
      <p>你知道这是欲加之罪。但在这间牢房里，逻辑和道理都不重要了。</p>
    </div>
    <div class="dialogue">
      <div class="dialogue-speaker">审讯御史</div>
      <div class="dialogue-text">苏轼，你最好老实交代，不要妄想蒙混过关。你的诗里藏了多少对朝廷的怨恨？</div>
    </div>
  `,
  choices: [
    { text: "一条条辩解，据理力争。那些诗就是写景抒情，哪有什么影射。", next: "prison_defiant", trait: "courage", value: 2, flash: "你选择了正面对抗" },
    { text: "低头认错，把他们想听的话说了。保命要紧。", next: "prison_submit", trait: "courage", value: -1, flash: "你选择了以退为进" },
    { text: "沉默。不辩解也不认错。说什么都是错。", next: "prison_silent", trait: "resilience", value: 1, flash: "你选择了沉默以对" }
  ]
},

"prison_defiant": {
  chapter: "第二章 · 乌台风雨",
  year: "元丰二年 · 八至十二月",
  content: `
    <div class="story-text">
      <p>你逐首解释，引经据典，说明每一句诗的来历和用意。你说得有理有据，御史们一时语塞。</p>

// ========== GAME FUNCTIONS ==========

function switchScreen(from, to) {
  const fromEl = document.getElementById(from);
  const toEl = document.getElementById(to);
  fromEl.classList.add('fade-out');
  setTimeout(() => {
    fromEl.classList.remove('active', 'fade-out');
    toEl.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, 500);
}

function updateProgress() {
  const pct = (state.nodeCount / state.totalNodes) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
}

function showFlash(text) {
  if (!text) return;
  const el = document.getElementById('personalityFlash');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function getTraitProfile() {
  const t = state.traits;
  let lines = [];

  if (t.courage >= 3) lines.push('你在逆境中选择了正面对抗，不肯低头。');
  else if (t.courage <= -1) lines.push('你更倾向于保存实力，等待时机。');
  else lines.push('你在刚与柔之间寻找平衡。');

  if (t.idealism >= 2) lines.push('即使身处低谷，你心中仍有不甘。入世之心未灭。');
  else if (t.resilience >= 3) lines.push('你展现出极强的适应力，能在任何处境中扎下根来。');
  else lines.push('你用自己的方式消化着命运的打击。');

  if (t.connection >= 2) lines.push('你在孤独中寻找与天地的连接，试图从更大的尺度理解人生。');

  return lines.join('<br><br>');
}

function renderNode(nodeId) {
  const node = story[nodeId];
  state.currentNode = nodeId;
  state.nodeCount++;
  updateProgress();

  if (node.isEnding) {
    renderEnding();
    return;
  }

  document.getElementById('chapterLabel').textContent = node.chapter;
  document.getElementById('yearLabel').textContent = node.year;

  const body = document.getElementById('narrativeBody');

  let html = node.content;

  if (node.choices) {
    html += `<div class="choices-container"><div class="choices-prompt">— 你的选择 —</div>`;
    node.choices.forEach((c, i) => {
      html += `<button class="choice-btn" onclick="makeChoice('${c.next}', '${c.trait}', ${c.value}, '${c.flash || ''}')">
        ${c.text}
      </button>`;
    });
    html += `</div>`;
  } else if (node.continue) {
    html += `<button class="btn-continue" onclick="renderNode('${node.continue}')">继 续</button>`;
  }

  body.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });

  if (nodeId !== state.currentNode) return;
  if (document.getElementById('narrative-screen').classList.contains('active') === false) {
    switchScreen('title-screen', 'narrative-screen');
  }
}

function makeChoice(next, trait, value, flash) {
  state.traits[trait] += value;
  state.choices.push({ node: state.currentNode, choice: next, trait, value });
  if (flash) showFlash(flash);
  setTimeout(() => renderNode(next), 300);
}

function renderEnding() {
  switchScreen('narrative-screen', 'ending-screen');

  const profile = getTraitProfile();
  const totalChoices = state.choices.length;

  document.getElementById('endingContent').innerHTML = `
    <div class="title-era" style="margin-bottom:2rem;">尾 声</div>
    <div class="ending-poem">
      黄州之后的苏东坡，再也不是从前那个苏轼了。<br>
      他不再是那个锋芒毕露的天才，<br>
      而是一个经历过至暗时刻、<br>
      依然选择好好活着的人。
    </div>
    <div class="ink-wash-divider"></div>
    <div class="ending-stats">
      <div class="stat-item">
        <div class="stat-num">${totalChoices}</div>
        <div class="stat-label">次抉择</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">3</div>
        <div class="stat-label">年黄州岁月</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">1</div>
        <div class="stat-label">次重生</div>
      </div>
    </div>
    <div class="ending-reflection">
      <div class="ending-reflection-title">— 你的选择映射 —</div>
      <div class="ending-reflection-text">${profile}</div>
    </div>
    <p style="font-size:0.85rem; color:var(--ink-faint); margin-bottom:2.5rem; line-height:1.9;">
      你在苏东坡的人生里做出的每一个选择，<br>其实都是你自己面对逆境时的本能反应。
    </p>
    <button class="btn-restart" onclick="restart()">重 新 体 验</button>
  `;
}

function startGame() {
  switchScreen('title-screen', 'narrative-screen');
  setTimeout(() => renderNode('start'), 600);
}

function restart() {
  state.currentNode = null;
  state.choices = [];
  state.traits = { courage: 0, idealism: 0, connection: 0, resilience: 0 };
  state.nodeCount = 0;
  document.getElementById('progressBar').style.width = '0%';
  switchScreen('ending-screen', 'title-screen');
}
</script>
